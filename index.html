<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Feud Game</title>
<style>
  :root { color-scheme: dark; --gold:#ffc84a; --cyan:#26cfff; --blue:#062d9a; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#03091c; color:white; font-family:Arial,Helvetica,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:12px; }
  button,input,select { font:inherit; }
  button { cursor:pointer; }
  .app { width:min(100%, calc((100vh - 24px) * 16 / 9)); }
  .board { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#061b52 center/100% 100% no-repeat; border-radius:3px; box-shadow:0 0 28px #007dff55; isolation:isolate; }
  .overlay { position:absolute; inset:0; }
  .question { position:absolute; left:28.25%; top:25.1%; width:43.5%; height:9.8%; display:flex; align-items:center; justify-content:center; padding:0 2%; text-align:center; color:#fff; font-weight:800; font-size:clamp(10px,2.1vw,24px); line-height:1.05; text-shadow:0 2px 3px #00133f; overflow:hidden; }
  .answer { position:absolute; width:21.5%; height:9.1%; border:1px solid transparent; border-radius:clamp(4px,.8vw,9px); background:transparent; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:3%; padding:0 2.1%; box-shadow:none; transition:filter .15s, background .15s; }
  .answer:hover:not(:disabled) { background:transparent; }
  .answer:focus-visible { outline:2px solid #7ce8ff; outline-offset:2px; }
  .answer:disabled { cursor:default; }
  .answer .num { flex:0 0 auto; width:clamp(20px,4.5%,44px); height:70%; max-height:34px; aspect-ratio:1.25; border:2px solid #dbe9ff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(10px,1.9vw,21px); }
  .answer .answer-text { flex:1; text-align:left; font-size:clamp(8px,1.35vw,16px); font-weight:800; overflow-wrap:anywhere; line-height:1.05; }
  .answer .points { flex:0 0 auto; font-weight:900; font-size:clamp(10px,1.8vw,20px); color:#ffe17a; }
  .answer.revealed { background:linear-gradient(135deg,rgba(4,91,160,.97),rgba(0,34,107,.98)); }
  .answer.revealed .num { display:none; }
  .answer.revealed .answer-text { text-align:center; }
  .team { position:absolute; top:35.8%; width:15.9%; height:15.1%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3%; text-align:center; padding:1%; }
  .team.left { left:9.2%; } .team.right { right:9.2%; }
  .team-name { width:100%; min-width:0; background:transparent; border:0; border-bottom:1px solid #48cfff88; color:#fff; text-align:center; font-weight:900; font-size:clamp(9px,1.55vw,17px); text-shadow:0 2px 3px #00123d; outline:none; padding:1px; }
  .team-name:focus { background:#001b60aa; }
  .team-score { font-size:clamp(16px,3.15vw,34px); line-height:1; font-weight:900; color:#fff; text-shadow:0 2px 4px #00123d,0 0 8px #21aaff; }
  .bottom-left { position:absolute; left:25%; top:84.8%; width:14.9%; height:8.1%; display:flex; align-items:center; justify-content:center; padding:1%; }
  .team-select { width:100%; max-width:100%; background:#03276f; color:white; border:1px solid #36cfff; border-radius:5px; padding:4px 2px; font-size:clamp(8px,1.15vw,13px); font-weight:700; }
  .bottom-center { position:absolute; left:41.1%; top:86.5%; width:17.6%; height:5.2%; }
  .award { width:100%; height:100%; border:1px solid #a6caff; border-radius:5px; background:linear-gradient(#334c76,#12274f); color:#fff; font-size:clamp(8px,1.15vw,13px); font-weight:900; text-shadow:0 1px 2px #000; padding:0 3px; }
  .award:hover { filter:brightness(1.25); }
  .bottom-right { position:absolute; left:59.7%; top:84.8%; width:16.1%; height:8.3%; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; text-align:center; }
  .round { font-size:clamp(8px,1.2vw,14px); font-weight:900; text-shadow:0 1px 3px #000; }
  .multiplier { color:#ffe17a; font-size:clamp(8px,1.1vw,13px); font-weight:900; text-shadow:0 1px 3px #000; }
  .utility { position:absolute; left:1%; bottom:1%; display:flex; gap:5px; z-index:5; opacity:.92; }
  .utility button { background:#061a50dd; border:1px solid #4ccfff; border-radius:4px; color:#fff; padding:4px 7px; font-size:clamp(8px,.9vw,11px); }
  .status { position:absolute; left:41%; top:76%; width:18%; text-align:center; color:#fff; font-weight:800; font-size:clamp(8px,1vw,12px); text-shadow:0 1px 3px #000; pointer-events:none; }
  .modal { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(0,5,25,.82); padding:4%; text-align:center; }
  .modal-card { width:min(80%,560px); border:2px solid var(--gold); border-radius:16px; padding:clamp(14px,3vw,30px); background:linear-gradient(145deg,#073da9,#020e3c); box-shadow:0 0 30px #008cff88; }
  .modal h1 { color:var(--gold); margin:0 0 10px; font-size:clamp(20px,4vw,40px); text-shadow:0 2px 3px #000; }
  .modal p { margin:8px 0 18px; font-size:clamp(11px,1.8vw,17px); }
  .primary { background:linear-gradient(#ffdb69,#e89a16); border:2px solid #fff0ad; border-radius:8px; padding:10px 22px; color:#1a1740; font-weight:900; box-shadow:0 3px 0 #8b4a00; }
  .primary:hover { filter:brightness(1.08); }
  .hidden { display:none !important; }
  .final-scores { display:flex; justify-content:center; gap:24px; flex-wrap:wrap; margin:16px 0; font-size:clamp(14px,2.4vw,22px); font-weight:900; }
  .hint { font-size:11px; color:#c4dfff; }
  @media (max-width:600px) {
    body { padding:0; }
    .app { width:100%; }
    .board { border-radius:0; }
    .answer { padding:0 1.5%; gap:1%; }
    .answer .answer-text { font-size:clamp(7px,1.55vw,12px); }
    .team-name { font-size:clamp(7px,1.7vw,12px); }
    .team-score { font-size:clamp(13px,3.5vw,22px); }
    .utility { bottom:0; }
    .utility button { padding:2px 4px; }
  }
</style>
</head>
<body>
<main class="app">
  <section class="board" id="board" aria-label="Family Feud game board">
    <div class="overlay">
      <div class="question" id="questionText">Press Start Game to begin!</div>
      <div id="answers"></div>
      <div class="team left">
        <input id="team1Name" class="team-name" aria-label="Team one name" value="TEAM BLUE" maxlength="18">
        <div class="team-score" id="team1Score">0</div>
      </div>
      <div class="team right">
        <input id="team2Name" class="team-name" aria-label="Team two name" value="TEAM GOLD" maxlength="18">
        <div class="team-score" id="team2Score">0</div>
      </div>
      <div class="bottom-left">
        <select class="team-select" id="teamSelect" aria-label="Team receiving points">
          <option value="0">Award to Team Blue</option>
          <option value="1">Award to Team Gold</option>
        </select>
      </div>
      <div class="bottom-center"><button class="award" id="awardNext">AWARD POINTS &amp; NEXT</button></div>
      <div class="bottom-right">
        <div class="round" id="roundCounter">ROUND — / 20</div>
        <div class="multiplier" id="multiplierLabel">NORMAL POINTS ×1</div>
      </div>
      <div class="status" id="status"></div>
      <div class="utility">
        <button id="previousBtn" title="Go to previous round without changing scores">◀ Previous</button>
        <button id="nextBtn" title="Go to next round without awarding points">Next ▶</button>
        <button id="restartBtn">Restart</button>
      </div>
    </div>
    <div class="modal" id="startModal">
      <div class="modal-card">
        <h1>FAMILY FEUD</h1>
        <p>Twenty rounds. Reveal answers, collect points, and see which team wins!</p>
        <button class="primary" id="startBtn">START GAME</button>
        <p class="hint">Tip: click a revealed tile only once. Edit team names directly on the board.</p>
      </div>
    </div>
    <div class="modal hidden" id="finalModal">
      <div class="modal-card">
        <h1>THAT'S THE GAME!</h1>
        <p id="winnerText">Final scores</p>
        <div class="final-scores" id="finalScores"></div>
        <button class="primary" id="playAgainBtn">PLAY AGAIN</button>
      </div>
    </div>
  </section>
</main>
<script>
"use strict";

/*
  Edit the twenty questions below. Each question must have 4–8 answers.
  Points are multiplied by 3 only in round 20; the board displays multiplied values.
*/
const QUESTIONS = [
  { question:"Name something people change on a regular basis.", answers:[["Clothes",85],["TV channel",6],["Their minds",4],["Hair",3]] },
  { question:"Name something that might be made out of rubber.", answers:[["Tires / inner tube",82],["Rubber bands",8],["Shoes / boots",4],["Balls",4]] },
  { question:"Name something you should throw out if it has a hole in it.", answers:[["Clothes / shoes",72],["Bag / trash bag",13],["Bucket",7],["Food / apple",7]] },
  { question:"Name something a person might slip into.", answers:[["Comfy clothes / shoes",73],["A coma",15],["A bath / shower",5],["Bed",5]] },
  { question:"Name something you will never throw away, no matter how ratty it gets.", answers:[["Clothes / shoes",65],["Blanket / quilt",18],["Teddy bear / doll",10],["Pillow",4]] },
  { question:"Name an activity that requires using your lips.", answers:[["Kissing",59],["Talking",24],["Whistling",7],["Singing",4],["Playing instruments",4]] },
  { question:"Name a place where you would hate to realize you left your phone behind.", answers:[["Airport",30],["Restaurant",22],["Concert / stadium",16],["Hotel",12],["School / work",9],["Taxi / rideshare",7],["Movie theater",4]] },
  { question:"Name something people do when they're trying not to laugh.", answers:[["Cover their mouth",28],["Look away / down",22],["Bite their lip",16],["Cough / fake a cough",12],["Think of something serious",9],["Leave the room",7],["Make a weird face",4]] },
  { question:"Name something you might accidentally say during a job interview.", answers:[["Something embarrassing",27],["A bad word",20],["I don't know",16],["The wrong company name",13],["A joke",10],["Too much personal information",8],["I need the money",6]] },
  { question:"Name something that makes a road trip feel much longer.", answers:[["Traffic",32],["Bad weather",19],["Someone asking 'are we there yet?'",15],["Getting lost",12],["No music",9],["Car trouble",7],["Having to stop often",4]] },
  { question:"Name something people are most likely to forget when leaving for vacation.", answers:[["Toothbrush",24],["Phone charger",22],["Sunscreen",16],["Medication",12],["Passport / ID",10],["Headphones",9],["Travel documents / tickets",7]] },
  { question:"Name a reason someone might pretend they didn't see a text.", answers:[["They're busy",30],["They don't know what to say",21],["They forgot",17],["They don't want to respond",13],["They're avoiding drama",9],["They fell asleep",6],["They read it by accident",4]] },
  { question:"Name something that can ruin a group photo.", answers:[["Someone blinking",29],["Someone making a face",21],["Bad lighting",16],["Someone is missing",12],["Blurry picture",9],["A photobomber",8],["Phone / camera problem",5]] },
  { question:"Name something you would not want to hear from a pilot.", answers:[["'We have a problem'",30],["'Brace for impact'",23],["A strange noise / announcement",15],["'This is my first flight'",12],["'The engine stopped'",9],["'Does anyone know how to fly?'",7],["'We're out of fuel'",4]] },
  { question:"Name something it might take a 100-year-old man 30 minutes to do.", answers:[["Go to the bathroom",24],["Walk any distance",16],["Get out of bed",15],["Make love",9],["Get dressed",8],["Climb stairs",6],["Eat",5]] },
  { question:"When a woman is trying to catch a man, name something she pretends to like.", answers:[["Sports",66],["His face / body",8],["Sex / being with him",7],["Jokes / personality",7],["Cars",3],["Beer",3]] },
  { question:"Name a place your boss might move your desk to if he really, really hated you.", answers:[["Basement",32],["Closet / storage room",23],["Near / in bathroom",19],["In the corner",8],["Hallway",4],["Outside / sidewalk",4],["Boiler room",3]] },
  { question:"Name something that's much more exciting when it's new.", answers:[["Car",55],["Love / romance",18],["Computer / laptop",6],["Movie",5],["Marriage / spouse",4],["Clothes / shoes",3]] },
  { question:"Name something that would make you suspicious if your friend suddenly bought it.", answers:[["A shovel",25],["A disguise",20],["A one-way ticket",16],["A lot of cleaning supplies",13],["A burner phone",11],["A lock / safe",9],["A lawyer's number",6]] },
  { question:"Name something people do when they think nobody is watching.", answers:[["Dance / sing",27],["Talk to themselves",21],["Pick their nose",17],["Eat from the fridge",13],["Make silly faces",10],["Practice conversations",7],["Check themselves in a mirror",5]] }
];

const board = document.getElementById("board");
const answerLayer = document.getElementById("answers");
const questionText = document.getElementById("questionText");
const roundCounter = document.getElementById("roundCounter");
const multiplierLabel = document.getElementById("multiplierLabel");
const statusEl = document.getElementById("status");
const teamSelect = document.getElementById("teamSelect");
const teamNames = [document.getElementById("team1Name"), document.getElementById("team2Name")];
const teamScoreEls = [document.getElementById("team1Score"), document.getElementById("team2Score")];

let roundIndex = -1;
let scores = [0, 0];
let roundAwarded = Array(QUESTIONS.length).fill(false);
let revealedByRound = QUESTIONS.map(() => new Set());
let gameStarted = false;

function currentQuestion() {
  return QUESTIONS[roundIndex];
}

function multiplier() {
  return roundIndex === QUESTIONS.length - 1 ? 3 : 1;
}

function backgroundFor(count) {
  return `images/feud-background${count}.png`;
}

function render() {
  if (!gameStarted || roundIndex < 0) return;

  const q = currentQuestion();

  board.style.backgroundImage = `url("${backgroundFor(q.answers.length)}")`;
  questionText.textContent = q.question;
  roundCounter.textContent = `ROUND ${roundIndex + 1} / ${QUESTIONS.length}`;

  multiplierLabel.textContent =
    roundIndex === QUESTIONS.length - 1
      ? "TRIPLE POINTS ×3"
      : "NORMAL POINTS ×1";

  multiplierLabel.style.color =
    roundIndex === QUESTIONS.length - 1 ? "#ffef82" : "#ffffff";

  teamNames[0].value = teamNames[0].value || "TEAM BLUE";
  teamNames[1].value = teamNames[1].value || "TEAM GOLD";

  teamSelect.options[0].textContent = `Award to ${teamNames[0].value}`;
  teamSelect.options[1].textContent = `Award to ${teamNames[1].value}`;

  teamScoreEls.forEach((el, i) => {
    el.textContent = scores[i].toLocaleString();
  });

  answerLayer.innerHTML = "";

  q.answers.forEach((answer, i) => {
    const col = i < 4 ? 0 : 1;
    const row = i < 4 ? i : i - 4;

    const btn = document.createElement("button");

    btn.className =
      "answer" + (revealedByRound[roundIndex].has(i) ? " revealed" : "");

    btn.style.left = col === 0 ? "28.25%" : "50.2%";
    btn.style.top = `${36.1 + row * 10.0}%`;

    btn.setAttribute("aria-label", `Reveal answer ${i + 1}`);

    if (revealedByRound[roundIndex].has(i)) {
      btn.innerHTML = `<span class="answer-text"></span><span class="points"></span>`;

      btn.querySelector(".answer-text").textContent = answer[0];
      btn.querySelector(".points").textContent = answer[1] * multiplier();

      btn.disabled = true;
    } else {
      btn.addEventListener("click", () => revealAnswer(i));
    }

    answerLayer.appendChild(btn);
  });

  const total = q.answers.reduce((sum, a, i) => {
    return sum + (
      revealedByRound[roundIndex].has(i)
        ? a[1] * multiplier()
        : 0
    );
  }, 0);

  statusEl.textContent = total ? `ROUND BANK: ${total}` : "";

  document.getElementById("previousBtn").disabled = roundIndex === 0;

  document.getElementById("nextBtn").disabled =
    roundIndex >= QUESTIONS.length - 1;

  document.getElementById("awardNext").textContent =
    roundAwarded[roundIndex]
      ? (roundIndex === QUESTIONS.length - 1 ? "FINAL RESULTS" : "NEXT")
      : "AWARD POINTS";
}
  function revealAnswer(index) {
  if (
    !gameStarted ||
    roundAwarded[roundIndex] ||
    revealedByRound[roundIndex].has(index)
  ) return;

  revealedByRound[roundIndex].add(index);
  render();
}

function awardAndNext() {
  if (!gameStarted || roundIndex < 0) return;

  // First click: award points and reveal every remaining answer.
  if (!roundAwarded[roundIndex]) {
    const q = currentQuestion();

    const bank = q.answers.reduce((sum, answer, i) => {
      return sum + (
        revealedByRound[roundIndex].has(i)
          ? answer[1] * multiplier()
          : 0
      );
    }, 0);

    scores[Number(teamSelect.value)] += bank;

    // Reveal the answers that were not guessed.
    q.answers.forEach((answer, i) => {
      revealedByRound[roundIndex].add(i);
    });

    roundAwarded[roundIndex] = true;
    render();
    return;
  }

  // Second click: advance without awarding points again.
  if (roundIndex === QUESTIONS.length - 1) {
    showFinal();
    return;
  }

  roundIndex++;
  render();
}

function showFinal() {
  teamScoreEls.forEach((el, i) => {
    el.textContent = scores[i].toLocaleString();
  });

  const names = teamNames.map((el, i) =>
    el.value.trim() || `TEAM ${i + 1}`
  );

  const winner =
    scores[0] === scores[1]
      ? "It's a tie!"
      : `${names[scores[0] > scores[1] ? 0 : 1]} wins!`;

  document.getElementById("winnerText").textContent = winner;
  document.getElementById("finalScores").innerHTML = "";

  names.forEach((name, i) => {
    const div = document.createElement("div");
    div.textContent = `${name}: ${scores[i].toLocaleString()}`;

    document.getElementById("finalScores").appendChild(div);
  });

  document.getElementById("finalModal").classList.remove("hidden");
}

function startGame() {
  gameStarted = true;
  roundIndex = 0;

  document.getElementById("startModal").classList.add("hidden");
  document.getElementById("finalModal").classList.add("hidden");

  render();
}

function resetGame() {
  if (!confirm("Restart the game? This resets the round and both team scores.")) {
    return;
  }

  scores = [0, 0];
  roundAwarded = Array(QUESTIONS.length).fill(false);
  revealedByRound = QUESTIONS.map(() => new Set());

  roundIndex = 0;
  gameStarted = true;

  document.getElementById("finalModal").classList.add("hidden");
  document.getElementById("startModal").classList.add("hidden");

  render();
}

function navigateTo(index) {
  if (index < 0 || index >= QUESTIONS.length) return;

  roundIndex = index;
  render();
}

// Button event listeners
document.getElementById("startBtn")
  .addEventListener("click", startGame);

document.getElementById("awardNext")
  .addEventListener("click", awardAndNext);

document.getElementById("previousBtn")
  .addEventListener("click", () => navigateTo(roundIndex - 1));

document.getElementById("nextBtn")
  .addEventListener("click", () => navigateTo(roundIndex + 1));

document.getElementById("restartBtn")
  .addEventListener("click", resetGame);

document.getElementById("playAgainBtn")
  .addEventListener("click", resetGame);

// Update team selection labels when team names change.
teamNames.forEach((input) => {
  input.addEventListener("input", () => {
    teamSelect.options[0].textContent =
      `Award to ${teamNames[0].value || "TEAM BLUE"}`;

    teamSelect.options[1].textContent =
      `Award to ${teamNames[1].value || "TEAM GOLD"}`;
  });
});

// Initial background.
board.style.backgroundImage = 'url("images/feud-background8.png")';

</script>
</body>
</html>
